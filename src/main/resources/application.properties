spring.application.name=jibrax

jwt.auth.converter.resource-id=jibrax-api
jwt.auth.converter.principal-attribute=preferred_username

logging.level.org.springframework.security=TRACE
logging.level.org.keycloak=DEBUG

server.port=${PORT:8080}

# --- DATABASE CONFIG ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jibrax}

# Vérifie bien que dans Railway tu as créé une variable "DB_USER" ou change ici pour "DB_USERNAME"
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- KEYCLOAK CONFIG ---
# N'oublie pas de mettre à jour ces URL aussi avec ta variable KEYCLOAK_URL pour la prod !
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/jibrax
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/jibrax/protocol/openid-connect/certs