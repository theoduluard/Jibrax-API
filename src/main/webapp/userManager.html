<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Formulaire création de compte</title>
    <link rel="stylesheet" href="/front/style.css">
</head>
<body>
<main class="card" role="main">

    <h1>Formulaire de création d'Utilisateur</h1>
        <div>
            <label for="firstname">Prénom</label>
            <input id="firstname" name="firstname" type="text" placeholder="Prénom" required />
        </div>

        <div>
            <label for="lastname">Nom</label>
            <input id="lastname" name="lastname" type="text" placeholder="Nom" required />
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="prenom.nom@exemple.com" required />
        </div>

        <div>
            <label for="username">Nom d'utilisateur</label>
            <input id="username" name="username" type="text" placeholder="Pseudo" required />
        </div>

        <div>
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" placeholder="********" minlength="6" required />
        </div>

        <div>
            <label for="team">Équipe</label>
            <select id="team" name="team" required>
                <option value="">Chargement des équipes...</option>
            </select>
        </div>

        <div class="full">
            <label for="image">Image</label>
            <input id="image" name="image" type="file" accept="image/*" />
        </div>

        <div class="full">
            <button id="validUser">Valider</button>
        </div>


        <div class="full">
            <button id="showUsers">Afficher les utilisateurs</button>
        </div>

        <div id="usersContainer" class="full" style="margin-top:20px; display:grid; gap:16px;"></div>
</main>
</body>
<script src="/front/slide_menu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script language="JavaScript" src="/front/app_user.js"></script>
</html>
