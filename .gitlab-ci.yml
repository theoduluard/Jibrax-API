stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  tags:
    - shell
    - linux
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 week

test:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  tags:
    - shell
    - linux
  script:
    - mvn test
    - mvn jacoco:report
  artifacts:
    when: always
    paths:
    - target/site/jacoco/
    - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml
    coverage: '/Total.*?([0-9]{1,3})%/'
    expire_in: 1 week
