stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 week

test:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
    expire_in: 1 week
